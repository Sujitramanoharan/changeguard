version: '3.8'

services:
  changeguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: changeguard-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - changeguard-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  changeguard-data:
