# Render Blueprint for ChangeGuard.
# In the Render dashboard: New -> Blueprint -> select this repo.
# Values marked `sync: false` are prompted for when the Blueprint is created.
services:
  - type: web
    name: changeguard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # PostgreSQL, so users, assessments and CAB decisions survive
      # restarts and redeploys.
      - key: DATABASE_URL
        fromDatabase:
          name: changeguard-db
          property: connectionString
      - key: CHANGEGUARD_JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REVIEWER_USERNAME
        sync: false
      - key: REVIEWER_PASSWORD
        sync: false
      # Optional: raises the GitHub API limit from 60 to 5,000 requests/hour.
      - key: GITHUB_TOKEN
        sync: false
      # Shared secret the GitHub pull-request check sends (see
      # .github/workflows/changeguard-pr-check.yml).
      - key: CHANGEGUARD_CI_API_KEY
        generateValue: true
      # Optional: RedTeamGPT screens ticket and PR text for prompt
      # injection before the LLM sees it (src/prompt_guard.py). Leave
      # REDTEAMGPT_URL empty to turn screening off.
      - key: REDTEAMGPT_URL
        sync: false
      - key: REDTEAMGPT_API_KEY
        sync: false
      # Seeds the demo history only when the database is empty.
      - key: SEED_DEMO_ON_EMPTY
        value: "true"

databases:
  - name: changeguard-db
    plan: free
    databaseName: changeguard
    user: changeguard
