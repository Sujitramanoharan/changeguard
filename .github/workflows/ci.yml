name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only PyTorch
        run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining Python dependencies
        run: |
          sed '/^torch==/d' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run test suite
        env:
          CHANGEGUARD_JWT_SECRET: ci-test-secret
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build
